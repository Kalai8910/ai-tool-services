<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40 AI Services - One Place</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>40+ AI Services - One Place</h1>
        <p>Choose any service, describe what you need - AI will do it for FREE!</p>

        <select id="serviceSelect">
            <option value="logo_design">Logo Design</option>
            <option value="resume_writing">Resume Writing</option>
            <option value="video_script">Video Script</option>
        </select>

        <textarea id="userInput" placeholder="Example: Create a logo for a coffee shop called Morning Brew"></textarea>

        <button id="generateBtn">Generate for FREE</button>

        <div id="loading" style="display:none;">Processing... Please wait</div>
        <div class="output-box" id="output"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
